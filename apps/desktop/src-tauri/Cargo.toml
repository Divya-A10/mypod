[package]
name = "mypod-desktop"
version = "0.1.0"
description = "myPod local music library"
authors = ["myPod"]
edition = "2021"

[lib]
name = "mypod_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-fs = "=2.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
objc2 = "=0.6.5"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVPlayer", "AVPlayerItem", "objc2-core-media"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMTime"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSURL", "NSString"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
