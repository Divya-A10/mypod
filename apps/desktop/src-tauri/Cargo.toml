[package]
name = "mypod-desktop"
version = "0.1.0"
description = "myPod local music library"
authors = ["myPod"]
edition = "2021"

[lib]
name = "mypod_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.2"

[target.'cfg(target_os = "ios")'.dependencies]
lofty = "=0.22.4"
tauri-plugin-fs = "=2.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
objc2 = "=0.6.5"
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["AVAudioSession", "AVAudioSessionTypes"] }
block2 = { version = "=0.6.2", default-features = false, features = ["alloc"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVPlayer", "AVPlayerItem", "objc2-core-media", "block2", "dispatch2"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMTime"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSURL", "NSString", "NSData", "NSDictionary", "NSNotification", "NSOperation", "NSValue", "NSObject"] }
objc2-media-player = { version = "=0.3.2", default-features = false, features = ["MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPRemoteControlTypes", "MPMediaItem", "block2"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["UIImage"] }

[dev-dependencies]
lofty = "=0.22.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
